<svg xmlns="http://www.w3.org/2000/svg" width="750" height="344" viewBox="0 0 750 344" role="img" aria-labelledby="title desc">
<title id="title">Mean absolute error of two forecasts for German load in 2019</title>
<desc id="desc">Horizontal paired bars compare the archived day-ahead forecast with the previous week at the same local time. Smaller errors are better. High demand is classified by realized load.</desc>
<rect width="750" height="344" fill="#fff"/><g font-family="system-ui, sans-serif" fill="#132a37">
<text x="18" y="27" font-size="20" font-weight="bold">How far off was each forecast?</text>
<text x="18" y="51" font-size="14">Mean absolute error (MW) · German national load, 2019</text>
<rect x="178" y="67" width="14" height="12" fill="#106d70"/><text x="199" y="78" font-size="13">Archived day-ahead</text>
<rect x="396" y="67" width="14" height="12" fill="#77487f"/><text x="417" y="78" font-size="13">Same hour last week</text>
<path d="M178.00 91V303" stroke="#d1dadd"/><text x="178.00" y="326" text-anchor="middle" font-size="12">0</text>
<path d="M336.33 91V303" stroke="#d1dadd"/><text x="336.33" y="326" text-anchor="middle" font-size="12">1,000</text>
<path d="M494.67 91V303" stroke="#d1dadd"/><text x="494.67" y="326" text-anchor="middle" font-size="12">2,000</text>
<path d="M653.00 91V303" stroke="#d1dadd"/><text x="653.00" y="326" text-anchor="middle" font-size="12">3,000</text>
<text x="18" y="116" font-size="16" font-weight="bold">All paired hours</text><text x="18" y="136" font-size="13">8,756 hours</text>
<rect x="178" y="103" width="314.97" height="15" fill="#106d70"/><text x="498.97" y="116" font-size="13">1,989</text>
<rect x="178" y="125" width="400.46" height="15" fill="#77487f"/><text x="584.46" y="138" font-size="13">2,529</text>
<text x="18" y="188" font-size="16" font-weight="bold">High demand</text><text x="18" y="208" font-size="13">876 hours</text>
<rect x="178" y="175" width="458.20" height="15" fill="#106d70"/><text x="642.20" y="188" font-size="13">2,894</text>
<rect x="178" y="197" width="432.96" height="15" fill="#77487f"/><text x="616.96" y="210" font-size="13">2,734</text>
<text x="18" y="260" font-size="16" font-weight="bold">Remaining hours</text><text x="18" y="280" font-size="13">7,880 hours</text>
<rect x="178" y="247" width="299.04" height="15" fill="#106d70"/><text x="483.04" y="260" font-size="13">1,889</text>
<rect x="178" y="269" width="396.85" height="15" fill="#77487f"/><text x="580.85" y="282" font-size="13">2,506</text>
</g></svg>
