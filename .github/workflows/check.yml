name: Offline research checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install image decoder for integration tests
        run: python -m pip install Pillow
      - name: Tests and clean-project reproduction
        run: |
          mkdir -p .local/tmp
          export TMPDIR="$PWD/.local/tmp"
          python -m unittest discover -s tests -v
          python vendor/ai4s-desktop/scripts/dev/test_stats_integrity.py
          python scripts/acceptance.py
          python ai4sci.py audit examples/opencode-study
          python examples/penguins/check_repro.py
          python examples/penguins/research/verify_independent.py
          python ai4sci.py audit examples/penguins
          python ai4sci.py audit examples/climate-sources
          (cd examples/penguins-revision && python replay.py && sha256sum --check original.sha256 && sha256sum --check artifacts.sha256)
          python ai4sci.py audit --submission examples/penguins-revision
          python ai4sci.py audit examples/power-forecast
